name: Build & Test Debug

on:
  push:
    branches: [ master, staging, stable, Starlight, main ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable, Starlight, main ]

jobs:
  build:
    if: github.actor != 'Dogborg' && github.event.pull_request.draft == false && github.event.head_commit.message != 'Automatic changelog update'
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    env:
      DOTNET_INSTALL_DIR: "./.dotnet"

    steps:
    - name: Install libraries
      run: |
        sudo apt-get update && sudo apt-get install -y libfreetype6

    - name: Checkout Master
      uses: actions/checkout@v4.2.2

    - name: Setup Submodule
      run: |
        git submodule update --init --recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.3.1
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /m

    - name: Run Content.Tests
      run: dotnet test --no-build --configuration DebugOpt Content.Tests/Content.Tests.csproj -- NUnit.ConsoleOut=0

    - name: Run Content.IntegrationTests
      run: |
        dotnet test --no-build --configuration DebugOpt -e DOTNET_gcServer=1 Content.IntegrationTests/Content.IntegrationTests.csproj -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed
  ci-success:
    name: Build & Test Debug
    needs:
      - build
    runs-on: self-hosted
    steps:
      - name: CI succeeded
        run: exit 0
