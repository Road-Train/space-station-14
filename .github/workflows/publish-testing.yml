name: Publish Testing

concurrency:
  group: publish-testing
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
  - cron: '0 10 * * *'

jobs:
  build:
    runs-on: arc-runner-set

    env:
      DOTNET_INSTALL_DIR: "./.dotnet"

    steps:
    - name: Install libraries
      run: |
        sudo apt-get update && sudo apt-get install -y libfreetype6

    - uses: actions/checkout@v4.2.2
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Fetch all tags and branches (RobustToolbox)
      run: |
        cd RobustToolbox
        git fetch --all --tags

    - name: Debug tags for RobustToolbox
      run: |
        cd RobustToolbox
        git tag

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 9.0.x

    - name: Get Engine Tag
      run: |
        cd RobustToolbox
        git fetch --depth=1

    - name: Install dependencies
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      run: dotnet run --project Content.Packaging server --platform win-x64 --platform linux-x64 --platform osx-x64 --platform linux-arm64

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    - name: Publish version
      run: Tools/publish_multi_request.py --fork-id afterlight-testing
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY }}
