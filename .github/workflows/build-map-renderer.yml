name: Build & Test Map Renderer

on:
  push:
    branches: [ master, staging, stable, main ]
  # merge_group:
  # pull_request:
  #   types: [ opened, reopened, synchronize, ready_for_review ]
  #   branches: [ master, staging, stable, Starlight, main ]

jobs:
  build:
    if: github.actor != 'Dogborg' && github.event.pull_request.draft == false &&

    runs-on: [self-hosted]

    env:
      DOTNET_INSTALL_DIR: "./.dotnet"

    steps:
      - name: Install libraries
        run: |
          sudo apt-get update && sudo apt-get install -y libfreetype6

      - name: Checkout Master
        uses: actions/checkout@v4.2.2

      - name: Setup Submodule
        run: |
          git submodule update --init --recursive

      - name: Pull engine updates
        uses: space-wizards/submodule-dependency@v0.1.5

      - name: Update Engine Submodules
        run: |
          cd RobustToolbox/
          git submodule update --init --recursive

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install dependencies
        run: dotnet restore

      - name: Build Project
        run: dotnet build Content.MapRenderer --configuration Release --no-restore /m

      - name: Run Map Renderer
        run: dotnet run --project Content.MapRenderer Dev

  ci-success:
    name: Build & Test Debug
    needs:
      - build
    runs-on: self-hosted
    steps:
      - name: CI succeeded
        run: exit 0
