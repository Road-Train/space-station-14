name: "Labels: PR"

on:
- pull_request_target

jobs:
  labeler:
    if: github.actor != 'Dogborg' && github.event.head_commit.message != 'Automatic changelog update'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: arc-runner-set
    steps:
    - uses: actions/labeler@v5
