- type: entity
  id: PartXenoHybrid
  parent: [BaseItem, BasePart]
  name: "xeno hybrid body part"
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: SulfuricAcid
        Quantity: 10

- type: entity
  id: TorsoXenoHybrid
  name: "xeno hybrid torso"
  parent: [PartXenoHybrid, BaseTorso]
  components:
  - type: Sprite
    sprite: _Afterlight/Species/XenoHybrid/parts.rsi
    state: "torso_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: SulfuricAcid
        Quantity: 20

