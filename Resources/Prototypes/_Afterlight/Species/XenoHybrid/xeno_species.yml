- type: species
  id: XenoHybrid
  name: species-name-xeno-hybrid
  roundStart: true
  prototype: MobXenoHybridPlayer
  sprites: MobXenoHybridSprites
  defaultSkinTone: "#525288"
  markingLimits: MobXenoHybridMarkingLimits
